# Figure settings shared by every site: each _quarto.yml lists this file under metadata-files, so the
# R plots (png figures, not plotly or highcharter charts) of all the vignettes are drawn the same way.
#
# Every plot is drawn 7 inches wide and shown at the full width of the text column, which is about
# 800 px on a desktop: an inch of the drawing becomes about 115 px on the screen, and ggplot2's
# default text comes out about as large as the text around the plot. Change only the height of a plot
# (fig.height in the chunk header): a plot drawn wider is shrunk into the same column, and its letters
# shrink with it (by 30% at 10 inches, by half at 14). A plot that needs more room gets more rows of
# panels and a larger height instead.
knitr:
  opts_chunk:
    fig.width: 7
    fig.height: 6
    out.width: "100%"
    dev: "ragg_png"
    # dpi also sets the height of plotly and highcharter charts (fig.height x dpi pixels), so it stays at
    # the screen's 96: a chart of the default height is 576 px tall. fig.retina 3 draws the png files
    # at 3 x 96 = 288 dots per inch (2016 px across), sharp on high-density screens
    dpi: 96
    fig.retina: 3
