project:
  type: website
  output-dir: _site           # CI copies this to <repo>/docs/example
  render:                     # pages only; code_options.R and code_rwf.R are sourced, not rendered
    - index.qmd
    - "*.Rmd"
    - "*.rmd"

website:
  title: "Worked Examples in R"
  description: "Worked examples in R: decision trees, LDA, regularized regression, Keras, measurement invariance, multitrait-multimethod, Thurstonian IRT, adaptive testing and statistical paradoxes."
  site-url: https://sedzinfo.github.io/vignettes/example/
  repo-url: https://github.com/sedzinfo/vignettes
  search: true
  navbar:
    left:
      - href: index.qmd
        text: Home
      - text: Machine learning
        menu:
          - EXAMPLE_DECISION_TREE.rmd
          - EXAMPLE_LDA.rmd
          - EXAMPLE_REGULARIZED_REGRESSION.Rmd
          - EXAMPLE_MNIST.rmd
      - text: Psychometrics
        menu:
          - EXAMPLE_MEASUREMENT_INVARIANCE.rmd
          - EXAMPLE_MULTITRAIT_MULTIMETHOD.rmd
          - EXAMPLE_TIRT.rmd
          - EXAMPLE_TIRT_SCORING_GR.Rmd
      - text: Adaptive testing
        menu:
          - EXAMPLE_SIMULATION_catR.rmd
          - EXAMPLE_MSTR.rmd
      - text: Statistics
        menu:
          - EXAMPLE_PARADOX.Rmd
    right:
      - icon: github
        href: https://github.com/sedzinfo/vignettes

format:
  html:
    theme: flatly
    highlight-style: tango
    css: styles.css
    toc: true
    toc-depth: 3
    code-fold: show
    code-tools: true
    embed-resources: false
    fig-align: center

execute:
  freeze: auto                 # only re-run documents whose source changed
  warning: false
  message: false
