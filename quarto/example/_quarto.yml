project:
  type: website
  output-dir: _site           # CI copies this to <repo>/docs/example
  render:                     # pages only; code_options.R and code_rwf.R are sourced, not rendered
    - index.qmd
    - "*.Rmd"
    - "*.rmd"

metadata-files:
  - ../_shared/_figures.yml   # size, resolution and device of the R plots, the same in every site

website:
