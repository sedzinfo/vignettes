project:
  type: website
  output-dir: _site           # CI copies this to <repo>/docs/example
  render:                     # pages only; code_options.R and code_rwf.R are sourced, not rendered
    - index.qmd
    - "*.Rmd"
    - "*.rmd"

metadata-files:
  - ../_shared/_figures.yml   # size, resolution and device of the R plots, the same in every site

website:
  title: "Worked Examples in R"
  description: "Worked examples in R: decision trees, LDA, regularized regression, Keras, measurement invariance, multitrait-multimethod, Thurstonian IRT, adaptive testing and statistical paradoxes."
  site-url: https://sedzinfo.github.io/vignettes/example/
  open-graph:                 # link previews (title, description, image) for LinkedIn, Mastodon, Slack...
    image: social-card.png    # the card of the site, drawn by ../_shared/social_card.R; set here so that
  twitter-card:               # ...and X; pages with plots use it too, not their first plot cropped
    image: social-card.png
  repo-url: https://github.com/sedzinfo/vignettes
  search: true
  navbar:
    left:
      - href: index.qmd
        text: Home
      - text: Machine learning
        menu:
          - EXAMPLE_DECISION_TREE.rmd
          - EXAMPLE_GRADIENT_BOOSTING.Rmd
          - EXAMPLE_LDA.rmd
          - EXAMPLE_MNIST.rmd
          - EXAMPLE_RANDOM_FOREST.Rmd
          - EXAMPLE_REGULARIZED_REGRESSION.Rmd
      - text: Psychometrics
        menu:
          - EXAMPLE_MEASUREMENT_INVARIANCE.rmd
          - EXAMPLE_MULTITRAIT_MULTIMETHOD.rmd
          - EXAMPLE_TIRT.rmd
          - EXAMPLE_TIRT_SCORING_GR.Rmd
          - EXAMPLE_TEST_NORMS.Rmd
          - EXAMPLE_SELECTION_VALIDITY.Rmd
      - text: Adaptive testing
        menu:
          - EXAMPLE_MSTR.rmd
          - EXAMPLE_SIMULATION_catR.rmd
      - text: Statistics
        menu:
          - EXAMPLE_GENERALIZED.rmd
          - EXAMPLE_GENERALIZED_LEAST_SQUARES.Rmd
          - EXAMPLE_HIERARCHICAL_REGRESSION.Rmd
          - EXAMPLE_IMBALANCED_LOGISTIC.Rmd
          - EXAMPLE_MISSING_DATA.Rmd
          - EXAMPLE_MODERATION_MEDIATION.Rmd
          - EXAMPLE_MULTILEVEL.Rmd
          - EXAMPLE_MULTINOMIAL_LOGISTIC.Rmd
          - EXAMPLE_ORDINAL_LOGISTIC.Rmd
          - EXAMPLE_PARADOX.Rmd
          - EXAMPLE_POLYNOMIAL_REGRESSION.Rmd
          - EXAMPLE_POWER_SIMULATION.Rmd
          - EXAMPLE_QUANTILE_REGRESSION.Rmd
          - EXAMPLE_ROBUST_REGRESSION.Rmd
          - EXAMPLE_TOBIT.Rmd
          - EXAMPLE_WEIGHTED_LEAST_SQUARES.Rmd
    right:
      - icon: github
        href: https://github.com/sedzinfo/vignettes

  # filled by footer.js (sedzinfo.github.io repository), the one footer of every site — edit it there
  page-footer:
    center: " "

comments:
  giscus:
    repo: sedzinfo/vignettes
    repo-id: "R_kgDOU6AfOA"
    category: "Announcements"
    category-id: "DIC_kwDOU6AfOM4DG8ZY"
    mapping: pathname            # one discussion per page
    reactions-enabled: true
    input-position: top
    theme: light
    language: en
    loading: lazy

format:
  html:
    theme: [flatly, ../_shared/styles.scss]   # flatly + shared rules (quarto/_shared/styles.scss)
    highlight-style: tango
    toc: true
    toc-depth: 3
    code-fold: show
    code-tools: true
    embed-resources: false
    fig-align: center
    include-after-body:                       # shared by all sites
      - ../_shared/_ga_consent.html           # cookie banner + Google Analytics
      - ../_shared/_mobile.html               # small screens: wide tables, plotly charts

execute:
  freeze: auto                 # only re-run documents whose source changed
  warning: false
  message: false
