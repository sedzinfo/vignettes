project:
  type: website
  output-dir: _site           # CI copies this to <repo>/docs/cat_irt_eap

website:
  title: "EAP Ability Estimation"
  description: "Computerised adaptive testing with EAP scoring, rebuilt step by step in base R for six IRT models and checked against catR."
  site-url: https://sedzinfo.github.io/vignettes/cat_irt_eap/
  repo-url: https://github.com/sedzinfo/vignettes
  search: true
  navbar:
    left:
      - href: index.qmd
        text: Home
      - text: Tutorials
        menu:
          - eap_dichotomous.Rmd
          - eap_rsm.Rmd
          - eap_pcm.Rmd
          - eap_grm.Rmd
          - eap_ggrm.Rmd
          - eap_nrm.Rmd
    right:
      - icon: github
        href: https://github.com/sedzinfo/vignettes
  sidebar:
    style: docked
    contents:
      - index.qmd
      - section: "Dichotomous"
        contents:
          - eap_dichotomous.Rmd
      - section: "Polytomous: Rasch family"
        contents:
          - eap_rsm.Rmd
          - eap_pcm.Rmd
      - section: "Polytomous: graded"
        contents:
          - eap_grm.Rmd
          - eap_ggrm.Rmd
      - section: "Polytomous: nominal"
        contents:
          - eap_nrm.Rmd
  page-footer:
    center: "Adapted from catR (Magis, Raîche & Barrada), GPL-3"

comments:
  giscus:
    repo: sedzinfo/vignettes
    repo-id: "R_kgDOU6AfOA"
    category: "Announcements"
    category-id: "DIC_kwDOU6AfOM4DG8ZY"
    mapping: pathname            # one discussion per page
    reactions-enabled: true
    input-position: top
    theme: light
    language: en
    loading: lazy

format:
  html:
    theme: flatly
    highlight-style: tango
    css: styles.css
    toc: true
    toc-depth: 3
    code-fold: show
    code-tools: true
    embed-resources: false     # images go to docs/<page>_files/, smaller pages
    fig-align: center

execute:
  freeze: auto                 # only re-run documents whose source changed
  warning: false
  message: false

knitr:
  opts_chunk:
    fig.width: 7
    fig.height: 6
    dpi: 150
    fig.retina: 2
    dev: ragg_png
