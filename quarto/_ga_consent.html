<!-- Cookie banner and Google Analytics, shared by every Quarto site (include-after-body) and docs/index.html (build_index.py).
     The choice is stored under the same localStorage key as https://sedzinfo.github.io/, so it carries across the whole domain.
     Any link to #cookie-settings reopens the banner. -->
<div id="cookie-banner" class="position-fixed bottom-0 start-0 end-0 bg-dark text-light p-3 shadow d-none" style="z-index: 1080;" role="dialog" aria-live="polite" aria-label="Cookie consent">
  <div class="container d-flex flex-column flex-md-row align-items-md-center gap-3">
    <p class="mb-0 small flex-grow-1">This site uses Google Analytics cookies to count visits and see which pages are read. No data is collected unless you accept. You can change your choice at any time from "Cookie settings" at the bottom of the page.</p>
    <div class="d-flex gap-2 flex-shrink-0">
      <button type="button" class="btn btn-light btn-sm" data-consent="no">Reject</button>
      <button type="button" class="btn btn-light btn-sm" data-consent="yes">Accept</button>
    </div>
  </div>
</div>
<script>
  // Google Analytics, loaded only after the visitor accepts cookies
  (function () {
    const GA_ID = "G-VSX11PYNWT";
    const KEY = "ga-consent";
    const banner = document.getElementById("cookie-banner");
    let loaded = false;

    function getConsent() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
    function saveConsent(v) { try { localStorage.setItem(KEY, v); } catch (e) {} }

    function loadGA() {
      window["ga-disable-" + GA_ID] = false;
      if (loaded) return;
      loaded = true;
      const s = document.createElement("script");
      s.async = true;
      s.src = "https://www.googletagmanager.com/gtag/js?id=" + GA_ID;
      document.head.appendChild(s);
      window.dataLayer = window.dataLayer || [];
      window.gtag = function () { dataLayer.push(arguments); };
      gtag("js", new Date());
      gtag("config", GA_ID, { anonymize_ip: true });
    }

    function stopGA() {
      window["ga-disable-" + GA_ID] = true;
      // Remove the _ga cookies Google Analytics may already have set
      document.cookie.split(";").map(c => c.trim().split("=")[0]).filter(n => n.indexOf("_ga") === 0).forEach(n => {
        document.cookie = n + "=; Max-Age=0; path=/";
        document.cookie = n + "=; Max-Age=0; path=/; domain=." + location.hostname;
      });
    }

    banner.querySelectorAll("[data-consent]").forEach(btn => btn.addEventListener("click", () => {
      const v = btn.dataset.consent;
      saveConsent(v);
      banner.classList.add("d-none");
      if (v === "yes") loadGA(); else stopGA();
    }));

    document.addEventListener("click", e => {
      const a = e.target.closest('a[href$="#cookie-settings"]');
      if (!a) return;
      e.preventDefault();
      banner.classList.remove("d-none");
    });

    const c = getConsent();
    if (c === "yes") loadGA();
    else if (c === null) banner.classList.remove("d-none");
  })();
</script>
