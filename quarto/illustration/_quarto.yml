project:
  type: website
  output-dir: _site           # CI copies this to <repo>/docs/illustration
  render:                     # pages only; code_options.R and code_rwf.R are sourced, not rendered
    - index.qmd
    - "*.Rmd"
    - "*.rmd"

metadata-files:
  - ../_shared/_figures.yml   # size, resolution and device of the R plots, the same in every site

website:
  title: "Illustrations in R"
  description: "Data visualisation in R with real data: Arctic sea ice, global temperature, airport weather, hot days and heatwaves in Athens, wildfires in Greece and on every continent, Gapminder, EU wages, Greek housing and real wages, Greece since 2000, the euro crisis countries, Greek public debt, Greece's shrinking and ageing population, the Greeks who left after the debt crisis, Greek tourism, what Greece makes, sells and buys, the education, skills, work and crime of Greece against the EU, whether Greece is a good place to invest, falling fertility, companies that replace workers with AI and hire them back, colour charts and optical illusions."
  site-url: https://sedzinfo.github.io/vignettes/illustration/
  open-graph:                 # link previews (title, description, image) for LinkedIn, Mastodon, Slack...
    image: social-card.png    # the card of the site, drawn by ../_shared/social_card.R; set here so that
  twitter-card:               # ...and X; pages with plots use it too, not their first plot cropped
    image: social-card.png
  repo-url: https://github.com/sedzinfo/vignettes
  search: true
  navbar:
    left:
      - href: index.qmd
        text: Home
      - text: Climate
        menu:
          - text: "Arctic Sea Ice Is Melting"
            href: ILLUSTRATION_SEA_ICE.Rmd
          - text: "Climate Data Visualisation"
            href: ILLUSTRATION_SEA_ICE_TEMP.Rmd
          - text: "NASA GISS Global Temperature Anomaly"
            href: ILLUSTRATION_CLIMATE_HIGHCHARTER.Rmd
          - text: "Airport Weather Analysis"
            href: ILLUSTRATION_AIRPORT_WEATHER.Rmd
          - text: "Athens Is Getting Hotter"
            href: ILLUSTRATION_ATHENS_HEAT.Rmd
          - text: "Greece Burning"
            href: ILLUSTRATION_GREEK_WILDFIRES.Rmd
          - text: "Where the World Burns"
            href: ILLUSTRATION_WORLD_WILDFIRES.Rmd
      - text: Greece
        menu:
          - text: "Greece Since 2000"
            href: ILLUSTRATION_GREECE_SINCE_2000.Rmd
          - text: "Same Crisis, Different Endings"
            href: ILLUSTRATION_EURO_CRISIS.Rmd
          - text: "Greek Public Debt"
            href: ILLUSTRATION_GREEK_DEBT.Rmd
          - text: "Fewer and Older"
            href: ILLUSTRATION_GREEK_POPULATION.Rmd
          - text: "The Greeks Who Left"
            href: ILLUSTRATION_GREEK_EMIGRATION.Rmd
          - text: "Greece at Work"
            href: ILLUSTRATION_GREEK_WORKFORCE.Rmd
          - text: "What Greece Makes, Sells and Buys"
            href: ILLUSTRATION_GREEK_ECONOMY.Rmd
          - text: "Greece's Summer Economy"
            href: ILLUSTRATION_GREEK_TOURISM.Rmd
          - text: "Is Greece a Good Place to Invest?"
            href: ILLUSTRATION_GREEK_INVESTMENT.Rmd
          - text: "Greek Housing Race"
            href: ILLUSTRATION_GREEK_HOUSING.Rmd
          - text: "Greek Wages Race"
            href: ILLUSTRATION_GREEK_WAGES_PRICES.Rmd
      - text: Europe and the world
        menu:
          - text: "Hans Rosling's Bubble Chart"
            href: ILLUSTRATION_GAPMINDER.Rmd
          - text: "The World Is Having Fewer Babies"
            href: ILLUSTRATION_FERTILITY.Rmd
          - text: "EU Salary Race"
            href: ILLUSTRATION_EU_SALARY.rmd
          - text: "Fired for AI, Hired Back"
            href: ILLUSTRATION_AI_LAYOFFS.Rmd
      - text: Graphics
        menu:
          - text: "R Colors"
            href: ILLUSTRATION_COLOR_CHART.Rmd
          - text: "Illusions in R"
            href: ILLUSTRATION_ILLUSIONS.rmd
    right:
      - icon: github
        href: https://github.com/sedzinfo/vignettes

  # filled by footer.js (sedzinfo.github.io repository), the one footer of every site — edit it there
  page-footer:
    center: " "

comments:
  giscus:
    repo: sedzinfo/vignettes
    repo-id: "R_kgDOU6AfOA"
    category: "Announcements"
    category-id: "DIC_kwDOU6AfOM4DG8ZY"
    mapping: pathname            # one discussion per page
    reactions-enabled: true
    input-position: top
    theme: light
    language: en
    loading: lazy

format:
  html:
    theme: [flatly, ../_shared/styles.scss]   # flatly + shared rules (quarto/_shared/styles.scss)
    highlight-style: tango
    toc: true
    toc-depth: 3
    code-fold: show
    code-tools: true
    embed-resources: false
    fig-align: center
    include-after-body:                       # shared by all sites
      - ../_shared/_ga_consent.html           # cookie banner + Google Analytics
      - ../_shared/_mobile.html               # small screens: wide tables, plotly charts

execute:
  freeze: auto                 # only re-run documents whose source changed
  warning: false
  message: false
