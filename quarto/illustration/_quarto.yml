project:
  type: website
  output-dir: _site           # CI copies this to <repo>/docs/illustration
  render:                     # pages only; code_options.R and code_rwf.R are sourced, not rendered
    - index.qmd
    - "*.Rmd"
    - "*.rmd"

website:
  title: "Illustrations in R"
  site-url: https://sedzinfo.github.io/vignettes/illustration/
  repo-url: https://github.com/sedzinfo/vignettes
  search: true
  navbar:
    left:
      - href: index.qmd
        text: Home
      - text: Climate
        menu:
          - ILLUSTRATION_SEA_ICE.Rmd
          - ILLUSTRATION_SEA_ICE_TEMP.Rmd
          - ILLUSTRATION_CLIMATE_HIGHCHARTER.Rmd
          - ILLUSTRATION_AIRPORT_WEATHER.Rmd
      - text: Data stories
        menu:
          - ILLUSTRATION_GAPMINDER.Rmd
          - ILLUSTRATION_EU_SALARY.rmd
      - text: Graphics
        menu:
          - ILLUSTRATION_COLOR_CHART.Rmd
          - ILLUSTRATION_ILLUSIONS.rmd
      - text: Psychometrics
        menu:
          - ILLUSTRATION_TIRT_SCORING_GR.Rmd
    right:
      - icon: github
        href: https://github.com/sedzinfo/vignettes

format:
  html:
    theme: flatly
    highlight-style: tango
    css: styles.css
    toc: true
    toc-depth: 3
    code-fold: show
    code-tools: true
    embed-resources: false
    fig-align: center

execute:
  freeze: auto                 # only re-run documents whose source changed
  warning: false
  message: false
