project:
  type: website
  output-dir: _site           # CI copies this to <repo>/docs/validation
  render:                     # pages only; code_options.R and code_rwf.R are sourced, not rendered
    - index.qmd
    - "*.Rmd"
    - "*.rmd"

website:
  title: "Scale Validation in R"
  description: "Psychometric validation of personality, interest, symptom and ability tests in R: reliability, factor structure, measurement invariance, bifactor models and item response theory for the BFI-44, the IPIP-50 (OCEAN), the IPIP-HEXACO, the IPIP-NEO-120, the RIASEC-48, the DASS-42 and the Vocabulary IQ Test."
  site-url: https://sedzinfo.github.io/vignettes/validation/
  repo-url: https://github.com/sedzinfo/vignettes
  search: true
  navbar:
    left:
      - href: index.qmd
        text: Home
      - text: Validation
        menu:
          - VALIDATION_BFI44.rmd
          - VALIDATION_OCEAN.rmd
          - VALIDATION_HEXACO.rmd
          - VALIDATION_IPIPNEO120.rmd
          - VALIDATION_RIASEC.rmd
          - VALIDATION_DASS.rmd
          - VALIDATION_VIQT.rmd
      - text: Descriptives
        menu:
          - VALIDATION_DESCRIPTIVES_OCEAN.rmd
    right:
      - icon: github
        href: https://github.com/sedzinfo/vignettes

  # filled by footer.js (sedzinfo.github.io repository), the one footer of every site — edit it there
  page-footer:
    center: " "

comments:
  giscus:
    repo: sedzinfo/vignettes
    repo-id: "R_kgDOU6AfOA"
    category: "Announcements"
    category-id: "DIC_kwDOU6AfOM4DG8ZY"
    mapping: pathname            # one discussion per page
    reactions-enabled: true
    input-position: top
    theme: light
    language: en
    loading: lazy

format:
  html:
    theme: flatly
    highlight-style: tango
    css: styles.css
    toc: true
    toc-depth: 3
    code-fold: show
    code-tools: true
    embed-resources: false
    fig-align: center
    include-after-body: ../_ga_consent.html   # cookie banner + Google Analytics, shared by all sites

execute:
  freeze: auto                 # only re-run documents whose source changed
  warning: false
  message: false
